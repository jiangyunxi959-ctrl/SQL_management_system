services:
  postgres:
    image: postgres:16-alpine
    container_name: zhishi-postgres
    environment:
      POSTGRES_USER: ${PGADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${PGADMIN_PASSWORD:-postgres}
    ports:
      - "${PGADMIN_PORT:-5432}:5432"
    volumes:
      - zhishi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGADMIN_USER:-postgres}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  zhishi_pgdata:
